<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login | W.A.F</title>
    <link
      rel="icon"
      type="image/x-icon"
      href="/frontend/assets/icons/favicon.ico"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&family=Open+Sans:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/frontend/css/login.css" />
  </head>
  <body>
    <a href="index.html" class="back-home">
      <i class="fas fa-arrow-left"></i> Back to Home
    </a>

    <div class="login-container">
      <!-- Left Side - Branding -->
      <div class="login-branding">
        <div class="brand-logo">
          <img
            src="/frontend/assets/icons/favicon.ico"
            alt="W.A.F"
            width="105"
            height="105"
          />
        </div>
        <h1 class="brand-title">ADMIN PORTAL</h1>
        <p class="brand-subtitle">WISDOM PERFORMANCE HUB</p>
        <div class="brand-tagline">
          <i class="fas fa-shield-alt"></i> Secure access for authorized
          personnel only
        </div>
      </div>

      <!-- Right Side - Form -->
      <div class="login-form-section">
        <div class="form-header">
          <h2 class="form-title">Welcome Back</h2>
          <p class="form-subtitle">Sign in to manage your academy</p>
        </div>

        <div id="loginAlert" class="alert alert-danger" role="alert"></div>

        <form id="loginForm">
          <div class="input-group">
            <!-- <i class="fas fa-envelope input-icon"></i> -->
            <input
              type="email"
              id="email"
              class="form-control"
              placeholder="Enter your email"
              required
              autocomplete="email"
            />
          </div>

          <div class="input-group">
            <!-- <i class="fas fa-lock input-icon"></i> -->
            <input
              type="password"
              id="password"
              class="form-control"
              placeholder="Enter your password"
              required
              autocomplete="current-password"
            />
          </div>

          <div class="form-options">
            <label class="form-check">
              <input type="checkbox" class="form-check-input" id="remember" />
              <span class="form-check-label">Remember me</span>
            </label>
            <a href="#" class="forgot-link">Forgot password?</a>
          </div>

          <button type="submit" class="btn-login" id="loginBtn">
            <i class="fas fa-sign-in-alt me-2"></i> Sign In
          </button>
        </form>

        <div class="divider">
          <span>Quick Access</span>
        </div>

        <div class="social-login">
          <button
            class="btn-social"
            onclick="alert('Demo: Use email/password')"
          >
            <i class="fas fa-user-shield"></i> Demo Admin
          </button>
        </div>

        <div class="back-home-link">
          <a href="index.html">
            <i class="fas fa-home"></i> Return to Public Site
          </a>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      document
        .getElementById("loginForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const btn = document.getElementById("loginBtn");
          const alert = document.getElementById("loginAlert");
          const originalContent = btn.innerHTML;

          btn.disabled = true;
          btn.innerHTML =
            '<span class="loading-spinner"></span> Authenticating...';
          alert.classList.remove("show");

          try {
            const response = await fetch(
              "https://wisdom-academy-website-backend.vercel.app/api/auth/login",
              {
                method: "POST",
                headers: {
                  "Content-Type": "application/json",
                },
                body: JSON.stringify({
                  email: document.getElementById("email").value,
                  password: document.getElementById("password").value,
                }),
              },
            );

            const data = await response.json();

            if (!response.ok) {
              throw new Error(data.message || "Invalid credentials");
            }

            localStorage.setItem("auth_token", data.token);
            localStorage.setItem("auth_user", JSON.stringify(data.user));

            // Redirect based on role
            if (data.user.role === "admin") {
              window.location.href = "./admin/admin.html";
            } else {
              window.location.href = "index.html";
            }
          } catch (err) {
            alert.textContent = "❌ " + err.message;
            alert.classList.add("show");
            btn.disabled = false;
            btn.innerHTML = originalContent;

            setTimeout(() => {
              alert.classList.remove("show");
            }, 5000);
          }
        });

      // Check if already logged in
      window.addEventListener("DOMContentLoaded", () => {
        const user = JSON.parse(localStorage.getItem("auth_user") || "null");
        if (user) {
          window.location.href =
            user.role === "admin" ? "./admin/admin.html" : "index.html";
        }
      });
    </script>
  </body>
</html>
