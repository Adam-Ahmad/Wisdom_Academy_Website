<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login | W.A.F</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
      :root {
        --waf-navy: #0a2540;
        --waf-blue: #1c4b8c;
        --waf-gold: #c8a951;
        --waf-light: #f8f9fa;
        --waf-gray: #6c757d;
      }
      body {
        font-family: "Segoe UI", system-ui, sans-serif;
        background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem;
      }

      .login-container {
        background: white;
        border-radius: 20px;
        box-shadow: 0 20px 60px rgba(10, 37, 64, 0.15);
        overflow: hidden;
        max-width: 1000px;
        width: 100%;
        display: flex;
        min-height: 600px;
      }

      .login-branding {
        background: linear-gradient(
          135deg,
          var(--waf-navy) 0%,
          var(--waf-blue) 100%
        );
        color: white;
        padding: 3rem;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        flex: 1;
        position: relative;
        overflow: hidden;
      }
      .login-branding::before {
        content: "";
        position: absolute;
        top: -50%;
        right: -50%;
        width: 200%;
        height: 200%;
        background: radial-gradient(
          circle,
          rgba(255, 255, 255, 0.1) 0%,
          transparent 70%
        );
        animation: pulse 15s ease-in-out infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.1);
        }
      }
      .brand-logo {
        width: 100px;
        height: 100px;
        background: white;
        border-radius: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 3rem;
        font-weight: 800;
        color: var(--waf-blue);
        margin-bottom: 1.5rem;
        position: relative;
        z-index: 1;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      }
      .brand-title {
        font-size: 2rem;
        font-weight: 800;
        margin-bottom: 0.5rem;
        position: relative;
        z-index: 1;
      }
      .brand-subtitle {
        font-size: 0.95rem;
        opacity: 0.9;
        position: relative;
        z-index: 1;
      }
      .brand-tagline {
        margin-top: 2rem;
        padding-top: 2rem;
        border-top: 1px solid rgba(255, 255, 255, 0.2);
        font-size: 0.85rem;
        opacity: 0.8;
        position: relative;
        z-index: 1;
      }

      .login-form-section {
        padding: 3rem;
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      .form-header {
        margin-bottom: 2rem;
      }
      .form-title {
        font-size: 2rem;
        font-weight: 800;
        color: var(--waf-navy);
        margin-bottom: 0.5rem;
      }
      .form-subtitle {
        color: var(--waf-gray);
        font-size: 0.95rem;
      }

      .form-label {
        font-weight: 600;
        color: var(--waf-navy);
        font-size: 0.85rem;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-bottom: 0.5rem;
      }
      .form-control {
        border: 2px solid #e9ecef;
        border-radius: 10px;
        padding: 0.8rem 1rem;
        font-size: 0.95rem;
        transition: all 0.3s;
      }
      .form-control:focus {
        border-color: var(--waf-blue);
        box-shadow: 0 0 0 4px rgba(28, 75, 140, 0.1);
      }
      .input-group {
        position: relative;
        margin-bottom: 1.5rem;
      }
      .input-icon {
        position: absolute;
        left: 1rem;
        top: 50%;
        transform: translateY(-50%);
        color: var(--waf-gray);
        font-size: 1.1rem;
      }
      .form-control-with-icon {
        padding-left: 3rem;
      }

      .btn-login {
        background: linear-gradient(
          135deg,
          var(--waf-navy) 0%,
          var(--waf-blue) 100%
        );
        color: white;
        border: none;
        border-radius: 10px;
        padding: 1rem;
        font-weight: 700;
        font-size: 1rem;
        width: 100%;
        margin-top: 1rem;
        transition: all 0.3s;
        box-shadow: 0 4px 15px rgba(10, 37, 64, 0.3);
      }
      .btn-login:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(10, 37, 64, 0.4);
      }
      .btn-login:active {
        transform: translateY(0);
      }

      .form-options {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin: 1.5rem 0;
        font-size: 0.9rem;
      }
      .form-check {
        display: flex;
        align-items: center;
      }
      .form-check-input {
        width: 18px;
        height: 18px;
        margin-right: 0.5rem;
        border: 2px solid #dee2e6;
        cursor: pointer;
      }
      .form-check-label {
        color: var(--waf-gray);
        cursor: pointer;
      }
      .forgot-link {
        color: var(--waf-blue);
        text-decoration: none;
        font-weight: 600;
        transition: color 0.2s;
      }
      .forgot-link:hover {
        color: var(--waf-navy);
        text-decoration: underline;
      }

      .divider {
        display: flex;
        align-items: center;
        margin: 2rem 0;
        color: var(--waf-gray);
        font-size: 0.85rem;
      }
      .divider::before,
      .divider::after {
        content: "";
        flex: 1;
        height: 1px;
        background: #dee2e6;
      }
      .divider span {
        padding: 0 1rem;
      }

      .back-home {
        position: absolute;
        top: 2rem;
        left: 2rem;
        color: var(--waf-gray);
        text-decoration: none;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 0.5rem;
        transition: color 0.2s;
      }
      .back-home:hover {
        color: var(--waf-blue);
      }

      .alert {
        border-radius: 10px;
        border: none;
        padding: 1rem;
        font-size: 0.9rem;
      }

      @media (max-width: 768px) {
        .login-container {
          flex-direction: column;
        }
        .login-branding {
          padding: 2rem;
        }
        .login-form-section {
          padding: 2rem;
        }
        .brand-logo {
          width: 80px;
          height: 80px;
          font-size: 2.5rem;
        }
        .brand-title {
          font-size: 1.5rem;
        }
      }
    </style>
  </head>
  <body>
    <a href="index.html" class="back-home">
      <i class="fas fa-arrow-left"></i> Back to Home
    </a>

    <div class="login-container">
      <!-- Left Side - Branding -->
      <div class="login-branding">
        <div class="brand-logo">W.A.F</div>
        <h1 class="brand-title">ADMIN PORTAL</h1>
        <p class="brand-subtitle">Wisdom Performance Hub</p>
        <div class="brand-tagline">
          <i class="fas fa-shield-alt me-2"></i>
          Secure access for authorized personnel only
        </div>
      </div>

      <!-- Right Side - Form -->
      <div class="login-form-section">
        <div class="form-header">
          <h2 class="form-title">Welcome Back</h2>
          <p class="form-subtitle">Sign in to manage your academy</p>
        </div>

        <div
          id="loginAlert"
          class="alert alert-danger d-none"
          role="alert"
        ></div>

        <form id="loginForm">
          <div class="input-group">
            <i class="fas fa-envelope input-icon"></i>
            <input
              type="email"
              id="email"
              class="form-control form-control-with-icon"
              placeholder="Enter your email"
              required
            />
          </div>
          <label class="form-label">Email Address</label>

          <div class="input-group">
            <i class="fas fa-lock input-icon"></i>
            <input
              type="password"
              id="password"
              class="form-control form-control-with-icon"
              placeholder="Enter your password"
              required
            />
          </div>
          <label class="form-label">Password</label>

          <div class="form-options">
            <div class="form-check">
              <input type="checkbox" class="form-check-input" id="remember" />
              <label class="form-check-label" for="remember">Remember me</label>
            </div>
            <a href="#" class="forgot-link">Forgot password?</a>
          </div>

          <button type="submit" class="btn-login" id="loginBtn">
            <i class="fas fa-sign-in-alt me-2"></i> Sign In
          </button>
        </form>

        <div class="divider">
          <span>Need help?</span>
        </div>

        <div class="text-center">
          <a
            href="index.html"
            class="text-decoration-none"
            style="color: var(--waf-blue); font-weight: 600"
          >
            <i class="fas fa-home me-1"></i> Return to Public Site
          </a>
        </div>
      </div>
    </div>

    <script src="js/api.js"></script>
    <script>
      document
        .getElementById("loginForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const btn = document.getElementById("loginBtn");
          const alert = document.getElementById("loginAlert");
          const originalContent = btn.innerHTML;

          btn.disabled = true;
          btn.innerHTML =
            '<i class="fas fa-spinner fa-spin me-2"></i> Authenticating...';
          alert.classList.add("d-none");

          try {
            const res = await apiFetch("/auth/login", {
              method: "POST",
              body: JSON.stringify({
                email: document.getElementById("email").value,
                password: document.getElementById("password").value,
              }),
            });

            localStorage.setItem("auth_token", res.token);
            localStorage.setItem("auth_user", JSON.stringify(res.user));

            // Redirect based on role
            if (res.user.role === "admin") {
              window.location.href = "/admin/dashboard.html";
            } else {
              window.location.href = "/index.html";
            }
          } catch (err) {
            alert.textContent =
              err.message || "Invalid credentials. Please try again.";
            alert.classList.remove("d-none");
            btn.disabled = false;
            btn.innerHTML = originalContent;
          }
        });

      // Check if already logged in
      const user = JSON.parse(localStorage.getItem("auth_user") || "null");
      if (user) {
        window.location.href =
          user.role === "admin" ? "/admin/dashboard.html" : "/index.html";
      }
    </script>
  </body>
</html>
