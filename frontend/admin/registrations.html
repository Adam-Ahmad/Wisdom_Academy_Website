<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registrations | W.A.F Admin</title>
    <link
      rel="icon"
      type="image/x-icon"
      href="/frontend/assets/icons/favicon.ico"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&family=Open+Sans:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/admin.css" />
  </head>
  <body>
    <button class="mobile-toggle"><i class="fas fa-bars"></i></button>
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">W.A.F</div>
        <div class="sidebar-title">ADMIN HUB</div>
        <div class="sidebar-subtitle">Wisdom Performance</div>
      </div>
      <nav class="nav-menu">
        <a href="admin.html" class="nav-item"
          ><i class="fas fa-chart-line"></i> Dashboard</a
        >
        <a href="registrations.html" class="nav-item active"
          ><i class="fas fa-user-plus"></i> Registrations</a
        >
        <a href="news.html" class="nav-item"
          ><i class="fas fa-newspaper"></i> News & Events</a
        >
        <a href="gallery.html" class="nav-item"
          ><i class="fas fa-images"></i> Media Gallery</a
        >
      </nav>
      <div class="sidebar-footer">
        <div class="admin-avatar"><i class="fas fa-user"></i></div>
        <div>
          <div class="admin-name" id="adminName">Loading...</div>
          <div class="admin-role" id="adminRole">ADMIN</div>
        </div>
      </div>
    </aside>

    <main class="main-content">
      <div class="page-header">
        <h1 class="page-title">PLAYER REGISTRATIONS</h1>
        <div class="d-flex gap-2">
          <select
            id="filterStatus"
            class="form-select form-select-sm"
            style="width: auto"
          >
            <option value="">All Status</option>
            <option value="pending">Pending</option>
            <option value="approved">Approved</option>
            <option value="rejected">Rejected</option>
          </select>
          <input
            type="text"
            id="searchReg"
            class="form-control form-control-sm"
            placeholder="Search name..."
            style="width: 200px"
          />
        </div>
      </div>

      <div class="card-custom">
        <div class="card-body p-0">
          <table class="table table-custom mb-0">
            <thead>
              <tr>
                <th>NAME</th>
                <th>DOB</th>
                <th>AGE GROUP</th>
                <th>EMAIL</th>
                <th>STATUS</th>
                <th>ACTIONS</th>
              </tr>
            </thead>
            <tbody id="regsTable"></tbody>
          </table>
        </div>
      </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/admin.js"></script>
    <script>
      let allRegs = [];

      async function loadRegistrations() {
        try {
          const res = await adminFetch("/registrations");
          allRegs = res.data || [];
          renderFiltered();
        } catch (e) {
          showToast(e.message, "error");
        }
      }

      function renderFiltered() {
        const status = document.getElementById("filterStatus").value;
        const search = document.getElementById("searchReg").value.toLowerCase();
        const filtered = allRegs.filter(
          (r) =>
            (!status || r.status === status) &&
            (!search ||
              `${r.firstName} ${r.lastName}`.toLowerCase().includes(search)),
        );

        renderTable(
          filtered,
          "regsTable",
          (r) => `
        <tr>
          <td class="fw-bold">${r.firstName} ${r.lastName}</td>
          <td>${new Date(r.dob).toLocaleDateString()}</td>
          <td>${r.ageGroup}</td>
          <td>${r.parentEmail}</td>
          <td>${statusBadge(r.status)}</td>
          <td>
            <button class="action-btn" title="Approve" onclick="updateStatus('${r._id}', 'approved')"><i class="fas fa-check"></i></button>
            <button class="action-btn" title="Reject" onclick="updateStatus('${r._id}', 'rejected')"><i class="fas fa-times"></i></button>
          </td>
        </tr>
      `,
        );
      }

      document
        .getElementById("filterStatus")
        .addEventListener("change", renderFiltered);
      document
        .getElementById("searchReg")
        .addEventListener("input", renderFiltered);

      async function updateStatus(id, status) {
        try {
          await adminFetch(`/registrations/${id}`, {
            method: "PATCH",
            body: JSON.stringify({ status }),
          });
          showToast(`Registration ${status}`);
          await loadRegistrations();
        } catch (e) {
          showToast(e.message, "error");
        }
      }

      loadRegistrations();
    </script>
  </body>
</html>
