<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>News & Events | W.A.F Admin</title>
    <link
      rel="icon"
      type="image/x-icon"
      href="/frontend/assets/icons/favicon.ico"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&family=Open+Sans:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/admin.css" />
  </head>
  <body>
    <button class="mobile-toggle"><i class="fas fa-bars"></i></button>
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">W.A.F</div>
        <div class="sidebar-title">ADMIN HUB</div>
        <div class="sidebar-subtitle">Wisdom Performance</div>
      </div>
      <nav class="nav-menu">
        <a href="admin.html" class="nav-item"
          ><i class="fas fa-chart-line"></i> Dashboard</a
        >
        <a href="registrations.html" class="nav-item"
          ><i class="fas fa-user-plus"></i> Registrations</a
        >
        <a href="news.html" class="nav-item active"
          ><i class="fas fa-newspaper"></i> News & Events</a
        >
        <a href="gallery.html" class="nav-item"
          ><i class="fas fa-images"></i> Media Gallery</a
        >
      </nav>
      <div class="sidebar-footer">
        <div class="admin-avatar"><i class="fas fa-user"></i></div>
        <div>
          <div class="admin-name" id="adminName">Loading...</div>
          <div class="admin-role" id="adminRole">ADMIN</div>
        </div>
      </div>
    </aside>

    <main class="main-content">
      <div class="page-header">
        <h1 class="page-title">NEWS & EVENTS</h1>
        <button
          class="btn-admin-primary"
          data-bs-toggle="modal"
          data-bs-target="#addNewsModal"
        >
          <i class="fas fa-plus"></i> ADD NEW
        </button>
      </div>

      <div class="row g-4" id="newsGrid"></div>
    </main>

    <!-- Add News Modal -->
    <div class="modal fade" id="addNewsModal" tabindex="-1">
      <div class="modal-dialog modal-lg">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title fw-bold">Add News / Event</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div class="modal-body">
            <form id="newsForm">
              <div class="mb-3">
                <label class="form-label fw-bold">Title</label
                ><input
                  type="text"
                  id="newsTitle"
                  class="form-control"
                  required
                />
              </div>
              <div class="row g-3 mb-3">
                <div class="col-md-6">
                  <label class="form-label fw-bold">Type</label
                  ><select id="newsType" class="form-select">
                    <option value="news">News</option>
                    <option value="event">Event</option>
                  </select>
                </div>
                <div class="col-md-6">
                  <label class="form-label fw-bold">Category</label
                  ><select id="newsCategory" class="form-select">
                    <option value="match">Match</option>
                    <option value="announcement">Announcement</option>
                    <option value="training">Training</option>
                  </select>
                </div>
              </div>
              <div class="mb-3">
                <label class="form-label fw-bold">Content</label
                ><textarea
                  id="newsContent"
                  class="form-control"
                  rows="5"
                  required
                ></textarea>
              </div>
              <div class="mb-3">
                <label class="form-label fw-bold">Featured Image URL</label
                ><input
                  type="text"
                  id="newsImage"
                  class="form-control"
                  placeholder="https://..."
                />
              </div>
              <button type="submit" class="btn-admin-primary w-100">
                Publish
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/admin.js"></script>
    <script>
      async function loadNews() {
        try {
          const res = await adminFetch("/news");
          const grid = document.getElementById("newsGrid");
          grid.innerHTML = (res.data || [])
            .map(
              (n) => `
          <div class="col-md-6 col-lg-4">
            <div class="card-custom h-100 d-flex flex-column">
              <div style="height:160px;background:#e2e8f0;position:relative;">
                ${n.featuredImage ? `<img src="${n.featuredImage}" style="width:100%;height:100%;object-fit:cover;">` : '<div class="d-flex align-items-center justify-content-center h-100"><i class="fas fa-image fa-2x text-muted"></i></div>'}
                <span class="position-absolute top-0 end-0 m-2 badge bg-${n.type === "event" ? "warning" : "primary"}">${n.type.toUpperCase()}</span>
              </div>
              <div class="card-body d-flex flex-column">
                <h5 class="fw-bold mb-2">${n.title}</h5>
                <p class="text-muted small flex-grow-1">${n.excerpt || n.content.substring(0, 80)}...</p>
                <div class="d-flex justify-content-between align-items-center mt-3">
                  <span class="small text-muted">${new Date(n.createdAt).toLocaleDateString()}</span>
                  <button class="btn btn-sm btn-outline-danger" onclick="deleteNews('${n._id}')"><i class="fas fa-trash"></i></button>
                </div>
              </div>
            </div>
          </div>
        `,
            )
            .join("");
        } catch (e) {
          showToast(e.message, "error");
        }
      }

      document
        .getElementById("newsForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const btn = e.target.querySelector("button");
          btn.disabled = true;
          btn.textContent = "Publishing...";
          try {
            await adminFetch("/news", {
              method: "POST",
              body: JSON.stringify({
                title: document.getElementById("newsTitle").value,
                type: document.getElementById("newsType").value,
                category: document.getElementById("newsCategory").value,
                content: document.getElementById("newsContent").value,
                featuredImage: document.getElementById("newsImage").value,
                status: "published",
              }),
            });
            showToast("Published successfully");
            bootstrap.Modal.getInstance(
              document.getElementById("addNewsModal"),
            ).hide();
            e.target.reset();
            loadNews();
          } catch (err) {
            showToast(err.message, "error");
          } finally {
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-plus"></i> ADD NEW';
          }
        });

      async function deleteNews(id) {
        if (!confirm("Delete this item?")) return;
        try {
          await adminFetch(`/news/${id}`, { method: "DELETE" });
          showToast("Deleted");
          loadNews();
        } catch (e) {
          showToast(e.message, "error");
        }
      }

      loadNews();
    </script>
  </body>
</html>
