<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gallery | W.A.F Admin</title>
    <link
      rel="icon"
      type="image/x-icon"
      href="/frontend/assets/icons/favicon.ico"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&family=Open+Sans:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/admin.css" />
  </head>
  <body>
    <button class="mobile-toggle"><i class="fas fa-bars"></i></button>
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="sidebar-logo">W.A.F</div>
        <div class="sidebar-title">ADMIN HUB</div>
        <div class="sidebar-subtitle">Wisdom Performance</div>
      </div>
      <nav class="nav-menu">
        <a href="admin.html" class="nav-item"
          ><i class="fas fa-chart-line"></i> Dashboard</a
        >
        <a href="registrations.html" class="nav-item"
          ><i class="fas fa-user-plus"></i> Registrations</a
        >
        <a href="news.html" class="nav-item"
          ><i class="fas fa-newspaper"></i> News & Events</a
        >
        <a href="gallery.html" class="nav-item active"
          ><i class="fas fa-images"></i> Media Gallery</a
        >
      </nav>
      <div class="sidebar-footer">
        <div class="admin-avatar"><i class="fas fa-user"></i></div>
        <div>
          <div class="admin-name" id="adminName">Loading...</div>
          <div class="admin-role" id="adminRole">ADMIN</div>
        </div>
      </div>
    </aside>

    <main class="main-content">
      <div class="page-header">
        <h1 class="page-title">MEDIA GALLERY</h1>
        <button
          class="btn-admin-primary"
          data-bs-toggle="modal"
          data-bs-target="#uploadModal"
        >
          <i class="fas fa-cloud-upload-alt"></i> UPLOAD MEDIA
        </button>
      </div>

      <div class="gallery-grid" id="galleryGrid"></div>
    </main>

    <!-- Upload Modal -->
    <div class="modal fade" id="uploadModal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title fw-bold">Upload Media</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div class="modal-body">
            <form id="uploadForm">
              <div class="upload-zone mb-3" id="dropZone">
                <i class="fas fa-cloud-upload-alt upload-icon"></i>
                <p class="fw-bold mb-1">Drag & Drop or Click to Upload</p>
                <p class="small text-muted mb-0">Images & Videos (Max 10MB)</p>
                <input
                  type="file"
                  id="fileInput"
                  class="d-none"
                  accept="image/*,video/*"
                />
              </div>
              <div class="mb-3">
                <label class="form-label fw-bold">Title</label
                ><input
                  type="text"
                  id="mediaTitle"
                  class="form-control"
                  required
                />
              </div>
              <div class="mb-3">
                <label class="form-label fw-bold">Category</label
                ><select id="mediaCategory" class="form-select">
                  <option value="team">Team Photos</option>
                  <option value="match">Match Highlights</option>
                  <option value="training">Training</option>
                  <option value="event">Events</option>
                </select>
              </div>
              <button type="submit" class="btn-admin-primary w-100">
                Upload
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/admin.js"></script>
    <script>
      const dropZone = document.getElementById("dropZone");
      const fileInput = document.getElementById("fileInput");
      let selectedFile = null;

      dropZone.addEventListener("click", () => fileInput.click());
      dropZone.addEventListener("dragover", (e) => {
        e.preventDefault();
        dropZone.classList.add("dragover");
      });
      dropZone.addEventListener("dragleave", () =>
        dropZone.classList.remove("dragover"),
      );
      dropZone.addEventListener("drop", (e) => {
        e.preventDefault();
        dropZone.classList.remove("dragover");
        if (e.dataTransfer.files.length) {
          selectedFile = e.dataTransfer.files[0];
          dropZone.innerHTML = `<i class="fas fa-check-circle text-success fa-2x mb-2"></i><p class="fw-bold">${selectedFile.name}</p>`;
        }
      });
      fileInput.addEventListener("change", () => {
        if (fileInput.files.length) {
          selectedFile = fileInput.files[0];
          dropZone.innerHTML = `<i class="fas fa-check-circle text-success fa-2x mb-2"></i><p class="fw-bold">${selectedFile.name}</p>`;
        }
      });

      document
        .getElementById("uploadForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          if (!selectedFile) return showToast("Please select a file", "error");

          const formData = new FormData();
          formData.append("media", selectedFile);
          formData.append("title", document.getElementById("mediaTitle").value);
          formData.append(
            "category",
            document.getElementById("mediaCategory").value,
          );
          formData.append(
            "type",
            selectedFile.type.startsWith("image") ? "image" : "video",
          );

          const btn = e.target.querySelector("button");
          btn.disabled = true;
          btn.textContent = "Uploading...";
          try {
            // Note: Requires Multer route in Phase 1 backend: POST /api/gallery/upload
            await fetch(`${API_BASE}/gallery/upload`, {
              method: "POST",
              headers: {
                Authorization: `Bearer ${localStorage.getItem("auth_token")}`,
              },
              body: formData,
            });
            showToast("Upload successful");
            bootstrap.Modal.getInstance(
              document.getElementById("uploadModal"),
            ).hide();
            e.target.reset();
            selectedFile = null;
            loadGallery();
          } catch (err) {
            showToast(err.message, "error");
          } finally {
            btn.disabled = false;
            btn.textContent = "Upload";
          }
        });

      async function loadGallery() {
        try {
          const res = await adminFetch("/gallery");
          document.getElementById("galleryGrid").innerHTML = (res.data || [])
            .map(
              (m) => `
          <div class="gallery-item">
            ${m.type === "image" ? `<img src="${m.url}" alt="${m.title}">` : `<video src="${m.url}" muted></video>`}
            <div class="gallery-overlay">
              <button class="btn btn-sm btn-light" onclick="window.open('${m.url}', '_blank')"><i class="fas fa-expand"></i></button>
              <button class="btn btn-sm btn-danger" onclick="deleteMedia('${m._id}')"><i class="fas fa-trash"></i></button>
            </div>
          </div>
        `,
            )
            .join("");
        } catch (e) {
          showToast(e.message, "error");
        }
      }

      async function deleteMedia(id) {
        if (!confirm("Delete this media?")) return;
        try {
          await adminFetch(`/gallery/${id}`, { method: "DELETE" });
          showToast("Deleted");
          loadGallery();
        } catch (e) {
          showToast(e.message, "error");
        }
      }

      loadGallery();
    </script>
  </body>
</html>
